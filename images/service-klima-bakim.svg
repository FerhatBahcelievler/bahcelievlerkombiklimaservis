<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF3F7"/>
      <stop offset="1" stop-color="#DCE4EC"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="800" fill="url(#sk)"/>

  <!-- AC indoor unit open for filter cleaning -->
  <rect x="180" y="220" width="640" height="220" rx="24" fill="#10233B"/>
  <rect x="220" y="180" width="560" height="60" rx="16" fill="#16314F" transform="rotate(-4 220 180)"/>

  <!-- filter grid being cleaned -->
  <g>
    <rect x="230" y="270" width="540" height="130" rx="10" fill="#0D1D30"/>
    <line x1="250" y1="280" x2="250" y2="390" stroke="#3B7DD8" stroke-width="6" opacity="0.7"/>
    <line x1="290" y1="280" x2="290" y2="390" stroke="#3B7DD8" stroke-width="6" opacity="0.6"/>
    <line x1="330" y1="280" x2="330" y2="390" stroke="#3B7DD8" stroke-width="6" opacity="0.5"/>
    <line x1="370" y1="280" x2="370" y2="390" stroke="#3B7DD8" stroke-width="6" opacity="0.6"/>
    <line x1="410" y1="280" x2="410" y2="390" stroke="#3B7DD8" stroke-width="6" opacity="0.7"/>
    <line x1="450" y1="280" x2="450" y2="390" stroke="#3B7DD8" stroke-width="6" opacity="0.5"/>
    <line x1="490" y1="280" x2="490" y2="390" stroke="#3B7DD8" stroke-width="6" opacity="0.6"/>
    <line x1="530" y1="280" x2="530" y2="390" stroke="#3B7DD8" stroke-width="6" opacity="0.7"/>
  </g>

  <!-- gloved hand with brush -->
  <g transform="rotate(-14 620 340)">
    <rect x="600" y="180" width="30" height="200" rx="12" fill="#E8532B"/>
    <rect x="586" y="130" width="60" height="70" rx="10" fill="#0D1D30"/>
    <line x1="595" y1="140" x2="595" y2="195" stroke="#3B7DD8" stroke-width="5"/>
    <line x1="608" y1="135" x2="608" y2="200" stroke="#3B7DD8" stroke-width="5"/>
    <line x1="621" y1="140" x2="621" y2="195" stroke="#3B7DD8" stroke-width="5"/>
  </g>
  <ellipse cx="620" cy="360" rx="55" ry="42" fill="#3B7DD8" transform="rotate(-14 620 360)"/>

  <!-- water/dust particles -->
  <circle cx="700" cy="230" r="7" fill="#3B7DD8" opacity="0.4"/>
  <circle cx="740" cy="255" r="5" fill="#3B7DD8" opacity="0.3"/>
  <circle cx="260" cy="470" r="6" fill="#3B7DD8" opacity="0.3"/>

  <!-- cool air waves below -->
  <path d="M300 520 q40 30 0 60 q-40 30 0 60" stroke="#3B7DD8" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.4"/>
  <path d="M420 520 q40 30 0 60 q-40 30 0 60" stroke="#3B7DD8" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M540 520 q40 30 0 60 q-40 30 0 60" stroke="#3B7DD8" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.4"/>

  <!-- badge -->
  <circle cx="820" cy="640" r="70" fill="#3B7DD8"/>
  <circle cx="820" cy="640" r="70" fill="none" stroke="#F5A623" stroke-width="4" opacity="0.5"/>
  <path d="M792 640 l20 20 l35 -45" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
