<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16314F"/>
      <stop offset="1" stop-color="#0D1D30"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="800" fill="url(#skp)"/>

  <!-- outdoor condenser unit -->
  <rect x="200" y="380" width="480" height="280" rx="20" fill="#EFF3F7"/>
  <circle cx="330" cy="520" r="90" fill="#0D1D30" opacity="0.08"/>
  <circle cx="330" cy="520" r="90" fill="none" stroke="#0D1D30" stroke-width="6" opacity="0.2"/>
  <g stroke="#0D1D30" stroke-width="5" opacity="0.35">
    <line x1="330" y1="450" x2="330" y2="590"/>
    <line x1="260" y1="520" x2="400" y2="520"/>
    <line x1="280" y1="470" x2="380" y2="570"/>
    <line x1="280" y1="570" x2="380" y2="470"/>
  </g>
  <rect x="480" y="420" width="160" height="200" rx="10" fill="#0D1D30" opacity="0.06"/>

  <!-- manifold gauge set -->
  <g>
    <circle cx="740" cy="280" r="70" fill="#EFF3F7" stroke="#0D1D30" stroke-opacity="0.2" stroke-width="5"/>
    <line x1="740" y1="280" x2="710" y2="240" stroke="#E8532B" stroke-width="6" stroke-linecap="round"/>
    <circle cx="740" cy="280" r="8" fill="#0D1D30" opacity="0.5"/>
    <rect x="700" y="345" width="80" height="24" rx="10" fill="#3B7DD8"/>
    <path d="M700 357 h-90" stroke="#3B7DD8" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- hose connecting gauge to outdoor unit -->
  <path d="M660 370 Q 560 400 470 420" fill="none" stroke="#F5A623" stroke-width="8" stroke-linecap="round"/>

  <!-- hand adjusting valve -->
  <ellipse cx="460" cy="430" rx="50" ry="38" fill="#F5A623" transform="rotate(10 460 430)"/>

  <!-- diagnostic tag -->
  <g>
    <rect x="120" y="130" width="230" height="70" rx="35" fill="#3B7DD8"/>
    <text x="235" y="174" font-family="'IBM Plex Mono', monospace" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">GAZ &amp; BASINÇ</text>
  </g>

  <!-- screws / small parts -->
  <circle cx="620" cy="650" r="8" fill="#F5A623"/>
  <circle cx="650" cy="670" r="6" fill="#F5A623" opacity="0.7"/>
</svg>
