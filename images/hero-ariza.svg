<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123156"/>
      <stop offset="1" stop-color="#0B1A2C"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect x="0" y="740" width="1600" height="160" fill="#0B1A2C" opacity="0.4"/>

  <!-- boiler unit smaller, off to side -->
  <rect x="1080" y="260" width="300" height="400" rx="20" fill="#F7F9FB" opacity="0.95"/>
  <rect x="1110" y="295" width="240" height="70" rx="8" fill="#10233B"/>
  <circle cx="1150" cy="330" r="16" fill="#E8532B"/>
  <rect x="1180" y="318" width="130" height="8" rx="4" fill="#F5A623" opacity="0.7"/>
  <rect x="1120" y="400" width="220" height="10" rx="5" fill="#0D1D30" opacity="0.1"/>
  <rect x="1120" y="425" width="220" height="10" rx="5" fill="#0D1D30" opacity="0.1"/>
  <rect x="1120" y="450" width="220" height="10" rx="5" fill="#0D1D30" opacity="0.1"/>

  <!-- diagnostic device / tablet held up -->
  <g>
    <rect x="560" y="330" width="230" height="330" rx="20" fill="#10233B" transform="rotate(-6 560 330)"/>
    <rect x="580" y="355" width="190" height="230" rx="10" fill="#0B1A2C" transform="rotate(-6 560 330)"/>
    <!-- waveform -->
    <path d="M600 470 l25 -40 l20 60 l25 -80 l25 50 l25 -30 l20 20" fill="none" stroke="#F5A623" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-6 560 330)"/>
    <circle cx="640" cy="600" r="10" fill="#E8532B" transform="rotate(-6 560 330)"/>
  </g>

  <!-- magnifier over boiler symbolizing detection -->
  <circle cx="1000" cy="470" r="70" fill="none" stroke="#F5A623" stroke-width="10" opacity="0.85"/>
  <line x1="1050" y1="520" x2="1110" y2="580" stroke="#F5A623" stroke-width="16" stroke-linecap="round" opacity="0.85"/>
  <circle cx="1000" cy="470" r="70" fill="#F5A623" opacity="0.08"/>
  <path d="M970 470 l20 20 l40 -50" stroke="#E8532B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- technician crouched -->
  <g>
    <rect x="330" y="560" width="36" height="140" rx="14" fill="#16314F"/>
    <rect x="400" y="600" width="36" height="100" rx="14" fill="#16314F"/>
    <rect x="320" y="690" width="55" height="20" rx="8" fill="#0D1D30"/>
    <rect x="390" y="690" width="55" height="20" rx="8" fill="#0D1D30"/>

    <path d="M330 450 h110 l10 130 h-135 z" fill="#F5A623"/>
    <rect x="330" y="450" width="110" height="26" rx="10" fill="#0D1D30" opacity="0.15"/>

    <!-- arm holding tablet -->
    <path d="M440 470 q60 -30 90 -60" stroke="#F5A623" stroke-width="26" stroke-linecap="round" fill="none"/>
    <circle cx="538" cy="405" r="15" fill="#EFC98A"/>

    <path d="M340 470 q-30 30 -25 80" stroke="#F5A623" stroke-width="26" stroke-linecap="round" fill="none"/>
    <circle cx="308" cy="555" r="14" fill="#EFC98A"/>

    <circle cx="385" cy="415" r="33" fill="#EFC98A"/>
    <path d="M352 405 a33 29 0 0 1 66 -4 q-33 -17 -66 4z" fill="#0D1D30"/>
    <path d="M350 402 q35 -28 70 0 h-8 q-27 -17 -54 0z" fill="#E8532B"/>
  </g>

  <circle cx="1000" cy="470" r="130" fill="#F5A623" opacity="0.05"/>
</svg>
