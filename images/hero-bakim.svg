<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16314F"/>
      <stop offset="1" stop-color="#0D1D30"/>
    </linearGradient>
    <linearGradient id="wall1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFF3F7"/>
      <stop offset="1" stop-color="#DCE4EC"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg1)"/>
  <rect x="0" y="120" width="1600" height="780" fill="url(#wall1)" opacity="0.08"/>
  <!-- floor -->
  <rect x="0" y="740" width="1600" height="160" fill="#0D1D30" opacity="0.35"/>

  <!-- wall panel behind boiler -->
  <rect x="560" y="150" width="480" height="560" rx="18" fill="#EFF3F7" opacity="0.10"/>

  <!-- pipes -->
  <path d="M600 200 V150 M960 200 V150" stroke="#F5A623" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
  <circle cx="600" cy="150" r="14" fill="#F5A623" opacity="0.55"/>
  <circle cx="960" cy="150" r="14" fill="#F5A623" opacity="0.55"/>

  <!-- boiler unit -->
  <rect x="600" y="200" width="360" height="460" rx="22" fill="#F7F9FB"/>
  <rect x="600" y="200" width="360" height="460" rx="22" fill="none" stroke="#0D1D30" stroke-width="3" opacity="0.15"/>
  <!-- front open panel hanging -->
  <rect x="965" y="230" width="120" height="380" rx="12" fill="#EFF3F7" stroke="#0D1D30" stroke-opacity="0.15" stroke-width="3" transform="rotate(8 965 230)"/>

  <!-- boiler display -->
  <rect x="640" y="240" width="280" height="90" rx="10" fill="#10233B"/>
  <circle cx="690" cy="285" r="20" fill="#E8532B"/>
  <circle cx="690" cy="285" r="20" fill="none" stroke="#F5A623" stroke-width="3"/>
  <rect x="730" y="270" width="150" height="10" rx="5" fill="#F5A623" opacity="0.8"/>
  <rect x="730" y="292" width="100" height="8" rx="4" fill="#F5A623" opacity="0.5"/>

  <!-- gauges -->
  <circle cx="700" cy="400" r="42" fill="#EFF3F7" stroke="#0D1D30" stroke-opacity="0.2" stroke-width="4"/>
  <line x1="700" y1="400" x2="720" y2="378" stroke="#E8532B" stroke-width="5" stroke-linecap="round"/>
  <circle cx="820" cy="400" r="42" fill="#EFF3F7" stroke="#0D1D30" stroke-opacity="0.2" stroke-width="4"/>
  <line x1="820" y1="400" x2="800" y2="375" stroke="#E8532B" stroke-width="5" stroke-linecap="round"/>

  <!-- vents -->
  <rect x="650" y="470" width="260" height="12" rx="6" fill="#0D1D30" opacity="0.12"/>
  <rect x="650" y="500" width="260" height="12" rx="6" fill="#0D1D30" opacity="0.12"/>
  <rect x="650" y="530" width="260" height="12" rx="6" fill="#0D1D30" opacity="0.12"/>
  <rect x="650" y="560" width="260" height="12" rx="6" fill="#0D1D30" opacity="0.12"/>

  <!-- floating screws -->
  <circle cx="1030" cy="330" r="7" fill="#F5A623"/>
  <circle cx="1060" cy="360" r="6" fill="#F5A623" opacity="0.7"/>
  <circle cx="1015" cy="400" r="5" fill="#F5A623" opacity="0.5"/>

  <!-- technician figure -->
  <g>
    <!-- toolbox -->
    <rect x="380" y="700" width="140" height="70" rx="8" fill="#E8532B"/>
    <rect x="410" y="685" width="80" height="20" rx="6" fill="#E8532B"/>
    <rect x="380" y="700" width="140" height="16" fill="#0D1D30" opacity="0.15"/>

    <!-- legs -->
    <rect x="430" y="560" width="34" height="150" rx="14" fill="#16314F"/>
    <rect x="480" y="560" width="34" height="150" rx="14" fill="#16314F"/>
    <rect x="420" y="695" width="55" height="20" rx="8" fill="#0D1D30"/>
    <rect x="475" y="695" width="55" height="20" rx="8" fill="#0D1D30"/>

    <!-- torso overalls -->
    <path d="M410 420 h120 l14 150 h-148 z" fill="#F5A623"/>
    <rect x="410" y="420" width="120" height="30" rx="10" fill="#0D1D30" opacity="0.15"/>

    <!-- arm reaching to boiler -->
    <path d="M525 450 q60 -10 95 -40" stroke="#F5A623" stroke-width="30" stroke-linecap="round" fill="none"/>
    <circle cx="628" cy="405" r="16" fill="#EFC98A"/>

    <!-- wrench in hand -->
    <rect x="615" y="380" width="70" height="14" rx="7" fill="#0D1D30" transform="rotate(-30 615 380)"/>

    <!-- other arm -->
    <path d="M415 440 q-40 20 -45 70" stroke="#F5A623" stroke-width="28" stroke-linecap="round" fill="none"/>
    <circle cx="368" cy="515" r="15" fill="#EFC98A"/>

    <!-- head -->
    <circle cx="470" cy="385" r="34" fill="#EFC98A"/>
    <path d="M436 375 a34 30 0 0 1 68 -4 q-34 -18 -68 4z" fill="#0D1D30"/>
    <!-- safety cap -->
    <path d="M434 372 q36 -30 72 0 h-8 q-28 -18 -56 0z" fill="#E8532B"/>
  </g>

  <!-- ambient light glow -->
  <circle cx="690" cy="285" r="90" fill="#F5A623" opacity="0.06"/>
</svg>
