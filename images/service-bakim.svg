<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF3F7"/>
      <stop offset="1" stop-color="#DCE4EC"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="800" fill="url(#sb)"/>

  <!-- burner unit close up -->
  <rect x="220" y="220" width="560" height="380" rx="24" fill="#10233B"/>
  <rect x="260" y="260" width="480" height="60" rx="10" fill="#0D1D30"/>
  <g>
    <rect x="290" y="345" width="16" height="150" rx="8" fill="#F5A623"/>
    <rect x="340" y="345" width="16" height="150" rx="8" fill="#F5A623" opacity="0.85"/>
    <rect x="390" y="345" width="16" height="150" rx="8" fill="#F5A623" opacity="0.7"/>
    <rect x="440" y="345" width="16" height="150" rx="8" fill="#F5A623" opacity="0.55"/>
    <rect x="490" y="345" width="16" height="150" rx="8" fill="#F5A623" opacity="0.4"/>
    <rect x="540" y="345" width="16" height="150" rx="8" fill="#F5A623" opacity="0.55"/>
    <rect x="590" y="345" width="16" height="150" rx="8" fill="#F5A623" opacity="0.7"/>
    <rect x="640" y="345" width="16" height="150" rx="8" fill="#F5A623" opacity="0.85"/>
    <rect x="690" y="345" width="16" height="150" rx="8" fill="#F5A623"/>
  </g>

  <!-- brush cleaning -->
  <g transform="rotate(-18 500 470)">
    <rect x="470" y="180" width="34" height="230" rx="12" fill="#E8532B"/>
    <rect x="452" y="120" width="70" height="80" rx="10" fill="#0D1D30"/>
    <line x1="460" y1="130" x2="460" y2="195" stroke="#F5A623" stroke-width="6"/>
    <line x1="475" y1="125" x2="475" y2="200" stroke="#F5A623" stroke-width="6"/>
    <line x1="490" y1="130" x2="490" y2="195" stroke="#F5A623" stroke-width="6"/>
    <line x1="505" y1="125" x2="505" y2="200" stroke="#F5A623" stroke-width="6"/>
  </g>

  <!-- glove hand holding brush -->
  <ellipse cx="500" cy="440" rx="60" ry="46" fill="#F5A623" transform="rotate(-18 500 440)"/>

  <!-- water droplets -->
  <circle cx="650" cy="240" r="8" fill="#3B7DD8" opacity="0.5"/>
  <circle cx="690" cy="270" r="6" fill="#3B7DD8" opacity="0.4"/>
  <circle cx="330" cy="600" r="7" fill="#3B7DD8" opacity="0.4"/>

  <!-- badge -->
  <circle cx="820" cy="640" r="70" fill="#E8532B"/>
  <circle cx="820" cy="640" r="70" fill="none" stroke="#F5A623" stroke-width="4" opacity="0.6"/>
  <path d="M792 640 l20 20 l35 -45" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
