<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16314F"/>
      <stop offset="1" stop-color="#0D1D30"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="800" fill="url(#sp)"/>

  <!-- open boiler chassis -->
  <rect x="200" y="150" width="600" height="500" rx="24" fill="#EFF3F7"/>
  <rect x="240" y="190" width="230" height="420" rx="14" fill="#0D1D30" opacity="0.08"/>
  <rect x="500" y="190" width="260" height="420" rx="14" fill="#0D1D30" opacity="0.05"/>

  <!-- circuit board detail -->
  <rect x="270" y="230" width="170" height="120" rx="10" fill="#10233B"/>
  <circle cx="300" cy="260" r="6" fill="#F5A623"/>
  <circle cx="330" cy="260" r="6" fill="#F5A623" opacity="0.6"/>
  <circle cx="360" cy="260" r="6" fill="#F5A623" opacity="0.3"/>
  <path d="M290 300 h140 M290 320 h100" stroke="#F5A623" stroke-width="4" opacity="0.5"/>

  <!-- valve / pump part -->
  <circle cx="620" cy="420" r="70" fill="#EFF3F7" stroke="#0D1D30" stroke-opacity="0.2" stroke-width="4"/>
  <circle cx="620" cy="420" r="30" fill="#E8532B"/>

  <!-- hand installing new part -->
  <g transform="rotate(12 470 520)">
    <rect x="440" y="450" width="60" height="60" rx="10" fill="#F5A623"/>
    <ellipse cx="470" cy="560" rx="55" ry="42" fill="#F5A623"/>
  </g>

  <!-- new spare part being placed -->
  <rect x="420" y="420" width="90" height="60" rx="10" fill="#3B7DD8"/>
  <rect x="420" y="420" width="90" height="60" rx="10" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7"/>

  <!-- orijinal parça tag -->
  <g>
    <rect x="640" y="130" width="220" height="70" rx="35" fill="#E8532B"/>
    <text x="750" y="174" font-family="'IBM Plex Mono', monospace" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">100% ORİJİNAL</text>
  </g>

  <!-- screws -->
  <circle cx="360" cy="600" r="8" fill="#F5A623"/>
  <circle cx="390" cy="620" r="6" fill="#F5A623" opacity="0.7"/>
</svg>
